<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tabla de seguidores · PINK CASE</title>
<style>
  @font-face { font-family: "Archivo Black"; src: url("/assets/fonts/archivo-black-latin.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Outfit"; src: url("/assets/fonts/outfit-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Outfit"; src: url("/assets/fonts/outfit-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Outfit"; src: url("/assets/fonts/outfit-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07050A; color: #fff; font-family: Outfit, system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 64px; }
  .marca { font-family: "Archivo Black", sans-serif; font-size: 15px; letter-spacing: .35em; color: #E84393; }
  h1 { font-family: "Archivo Black", sans-serif; font-size: clamp(30px, 6vw, 48px); line-height: 1.05; margin: 10px 0 6px; }
  .sub { color: #A99FB2; font-size: 15px; }
  .sub b { color: #fde68a; font-weight: 700; }
  /* Podio */
  .podio { display: flex; align-items: flex-end; gap: 12px; margin: 36px 0 8px; }
  .escalon { flex: 1; border-radius: 16px 16px 0 0; text-align: center; padding: 18px 8px 0; position: relative; }
  .escalon .pos { font-family: "Archivo Black", sans-serif; font-size: 44px; line-height: 1; }
  .escalon .nombres { font-weight: 700; font-size: 17px; margin-top: 6px; line-height: 1.35; }
  .escalon .dato { color: rgba(255,255,255,.85); font-size: 14px; margin-top: 4px; }
  .escalon .pago { font-family: "Archivo Black", sans-serif; font-size: 20px; margin-top: 8px; }
  .escalon.p1 { background: linear-gradient(180deg, #3a2f10, #171204); border: 1px solid #f59e0b; border-bottom: 0; min-height: 230px; order: 2; }
  .escalon.p1 .pos, .escalon.p1 .pago { color: #fde68a; }
  .escalon.p2 { background: linear-gradient(180deg, #23232a, #101014); border: 1px solid #9ca3af; border-bottom: 0; min-height: 175px; order: 1; }
  .escalon.p2 .pos, .escalon.p2 .pago { color: #e5e7eb; }
  .escalon.p3 { background: linear-gradient(180deg, #2a1a10, #140d07); border: 1px solid #b45309; border-bottom: 0; min-height: 140px; order: 3; }
  .escalon.p3 .pos, .escalon.p3 .pago { color: #fdba74; }
  .base { height: 10px; background: #17131c; border-radius: 0 0 12px 12px; }
  /* Tabla */
  h2 { font-family: "Archivo Black", sans-serif; font-size: 20px; margin: 32px 0 12px; }
  .tabla-scroll { overflow-x: auto; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; background: #0D0B10; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; }
  th { color: #A99FB2; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.1); }
  td { border-bottom: 1px solid rgba(255,255,255,.06); }
  tr:last-child td { border-bottom: 0; }
  tr.primero td { background: rgba(245, 158, 11, .08); }
  td.num, th.num { text-align: right; }
  td.total, th.total { text-align: right; font-weight: 700; color: #6ee7b7; }
  .medalla { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 9999px; font-weight: 700; font-size: 13px; background: rgba(255,255,255,.08); }
  .medalla.o { background: #f59e0b; color: #1a1204; }
  .medalla.p { background: #9ca3af; color: #111; }
  .medalla.b { background: #b45309; color: #fff; }
  .resumen { margin-top: 20px; color: #A99FB2; font-size: 14px; }
  .resumen b { color: #fff; }
  .pie { margin-top: 40px; color: #6b6470; font-size: 12px; text-align: center; }
  @media (max-width: 640px) {
    /* El podio en teléfono se ve igual que en computadora: 3 columnas,
       solo con letras y alturas más chicas para que quepa. */
    .podio { gap: 6px; }
    .escalon { padding: 12px 4px 0; border-radius: 12px 12px 0 0; }
    .escalon .pos { font-size: 30px; }
    .escalon .nombres { font-size: 13px; }
    .escalon .dato { font-size: 10.5px; }
    .escalon .pago { font-size: 15px; }
    .escalon.p1 { min-height: 185px; }
    .escalon.p2 { min-height: 150px; }
    .escalon.p3 { min-height: 125px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="marca">PINK CASE</div>
  <h1>Tabla de seguidores</h1>
  <p class="sub">Dinámica de asesores: <b>$2 por seguidor</b>. El podio y la tabla se ordenan solos con los datos de la hoja.</p>

  <div class="podio" id="podio"></div>
  <div class="base"></div>

  <h2>Tabla completa</h2>
  <div class="tabla-scroll">
    <table>
      <thead><tr>
        <th>Pos.</th><th>Asesor</th>
        <th class="num">Seguidores</th><th class="num">Instagram</th>
        <th class="num">Facebook</th><th class="num">TikTok</th>
        <th class="num">Clientes</th><th class="total">Total</th>
      </tr></thead>
      <tbody id="tabla"></tbody>
    </table>
  </div>
  <p class="resumen" id="resumen"></p>
  <p class="pie">PINK CASE · Tabla de seguidores · Ixtlahuaca Centro</p>
</div>

<script>
/* Datos de la hoja (en vivo se leerán con ?action=seguidores).
   MUESTRA: valores que pasó Axel el 2026-11-27. */
var ASESORES = [
  { nombre: "Ulises", clientes: 8, insta: 1, facebook: 7, tiktok: 0 },
  { nombre: "Kevin",  clientes: 1, insta: 0, facebook: 1, tiktok: 1 },
  { nombre: "Leo",    clientes: 2, insta: 0, facebook: 1, tiktok: 1 },
  { nombre: "Isa",    clientes: 1, insta: 0, facebook: 0, tiktok: 1 },
  { nombre: "Karla",  clientes: 1, insta: 1, facebook: 0, tiktok: 0 }
];
var PAGO = 2; /* $2 por seguidor */

function seguidores(a) { return a.insta + a.facebook + a.tiktok; }

/* Orden: más seguidores primero; en empate, más clientes; luego nombre.
   Posiciones densas: los empatados comparten escalón (1, 2, 2, 3, 3). */
function renderTabla() {
var orden = ASESORES.slice().sort(function (a, b) {
  return seguidores(b) - seguidores(a) || b.clientes - a.clientes
    || a.nombre.localeCompare(b.nombre, "es");
});
var pos = 0, ultimo = -1;
orden.forEach(function (a) {
  if (seguidores(a) !== ultimo) { pos++; ultimo = seguidores(a); }
  a.pos = pos;
});

var podio = [1, 2, 3].map(function (p) {
  return orden.filter(function (a) { return a.pos === p; });
});
var clases = { 1: "p1", 2: "p2", 3: "p3" };
var etiquetas = { 1: "1.er lugar", 2: "2.º lugar", 3: "3.er lugar" };
document.getElementById("podio").innerHTML = podio.map(function (grupo, i) {
  var p = i + 1;
  if (!grupo.length) return "";
  var seg = seguidores(grupo[0]);
  var pago = seg * PAGO;
  return '<div class="escalon ' + clases[p] + '">'
    + '<div class="pos">' + p + 'º</div>'
    + '<div class="nombres">' + grupo.map(function (a) { return a.nombre; }).join("<br/>") + '</div>'
    + '<div class="dato">' + etiquetas[p] + ' · ' + seg + (seg === 1 ? ' seguidor' : ' seguidores') + (grupo.length > 1 ? ' c/u' : '') + '</div>'
    + '<div class="pago">$' + pago + (grupo.length > 1 ? ' c/u' : '') + '</div></div>';
}).join("");

var medalla = { 1: "o", 2: "p", 3: "b" };
document.getElementById("tabla").innerHTML = orden.map(function (a) {
  var seg = seguidores(a);
  return '<tr' + (a.pos === 1 ? ' class="primero"' : '') + '>'
    + '<td><span class="medalla ' + (medalla[a.pos] || '') + '">' + a.pos + '</span></td>'
    + '<td><b>' + a.nombre + '</b></td>'
    + '<td class="num"><b>' + seg + '</b></td>'
    + '<td class="num">' + a.insta + '</td>'
    + '<td class="num">' + a.facebook + '</td>'
    + '<td class="num">' + a.tiktok + '</td>'
    + '<td class="num">' + a.clientes + '</td>'
    + '<td class="total">$' + (seg * PAGO) + '</td></tr>';
}).join("");

var totalSeg = orden.reduce(function (s, a) { return s + seguidores(a); }, 0);
document.getElementById("resumen").innerHTML =
  "Total: <b>" + totalSeg + " seguidores</b> · <b>$" + (totalSeg * PAGO) + "</b> a pagar entre " + orden.length + " asesores.";
}

/* Primero se pinta con los datos de la muestra; en cuanto el puente
   responde, se vuelve a pintar con los datos vivos de la hoja. Si el
   puente no responde, la página se queda con la muestra. */
renderTabla();
fetch("https://script.google.com/macros/s/AKfycbxaLju4YnKKt5C55CTo4B4N01A0WacpsdVKw_QcWmu0D7GJjqYxNud2NaihwrVeDUjInw/exec?action=seguidores")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (d && d.ok && Array.isArray(d.seguidores) && d.seguidores.length) {
      ASESORES = d.seguidores;
      renderTabla();
    }
  })
  .catch(function () { /* sin conexión al puente: queda la muestra */ });
</script>
</body>
</html>
